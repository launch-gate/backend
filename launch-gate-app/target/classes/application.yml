server:
  port: ${SERVER_PORT:8090}
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1

spring:
  application:
    name: launch-gate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/launch_gate}
    username: ${DB_USERNAME:launch_gate}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

launch-gate:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    issuer: ${JWT_ISSUER:launch-gate}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:1440}
    secret: ${JWT_SECRET}
  files:
    endpoint: ${MINIO_INTERNAL_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:launch-gate}
