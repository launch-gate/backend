server:
  port: 8090

spring:
  application:
    name: launch-gate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/launch_gate}
    username: ${DB_USERNAME:launch_gate}
    password: ${DB_PASSWORD:launch_gate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

launch-gate:
  jwt:
    issuer: ${JWT_ISSUER:launch-gate}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:1440}
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-before-production}
  files:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:launch-gate}
