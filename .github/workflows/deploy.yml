name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_PATH: /opt/backend
    steps:
      - name: Ensure develop branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/develop" ]; then
            echo "This workflow can only be started from branch develop"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build backend jar
        run: mvn -B -ntp test package

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy
          APP_JAR="$(find launch-gate-app/target -maxdepth 1 -name 'launch-gate-app-*.jar' ! -name '*.original' | head -n 1)"
          cp "$APP_JAR" deploy/app.jar
          cp Dockerfile docker-compose.yml .env.example deploy/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p ${DEPLOY_PATH}"

      - name: Upload backend bundle
        run: |
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/* "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/"

      - name: Rebuild and restart containers
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${DEPLOY_PATH} && docker compose up -d --build"
